[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hrapometr-proto"
version = "0.1.0"
description = "Прототип детектора храпа для Храпометра (этап 0)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "ai-edge-litert>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
